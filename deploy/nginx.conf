# Wolf Portfolio - Nginx site config
# 保存到服务器: /etc/nginx/sites-available/portfolio-itom
# 然后: sudo ln -s /etc/nginx/sites-available/portfolio-itom /etc/nginx/sites-enabled/
# 建议把 worldpeace.top 换成你的域名（或用服务器公网 IP）

server {
    listen 80;
    listen [::]:80;
    server_name worldpeace.top www.worldpeace.top;

    root /var/www/portfolio-itom;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（3D 纹理/图片体积大，缓存能明显提速）
    location ~*\.(webp|png|jpg|jpeg|gif|svg|woff2?|ttf|js|css|gz|mp3|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
